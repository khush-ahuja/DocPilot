name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install langgraph langchain-core qdrant-client pypdf fastapi python-multipart pytest httpx
      - run: pytest -q
