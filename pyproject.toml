[project]
name = "docpilot"
version = "1.0.0"
description = "Agentic RAG assistant built with LangGraph, Qdrant and FastAPI"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
